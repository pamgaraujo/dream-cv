document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n    <sc-if value=\"{{ isResult }}\" hint-placeholder-val=\"{{ false }}\">\n      <section style=\"margin-top:36px\" aria-live=\"polite\">\n        <div style=\"display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:20px\">\n          <div>\n            <p style=\"text-transform:uppercase;letter-spacing:1.5px;color:{{ accent }};font-size:12px;font-weight:700;margin:0 0 10px\">Your future is looking bright<\u002Fp>\n            <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:36px;margin:0\">Meet your dream self!<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n            <button type=\"button\" sc-camel-on-click=\"{{ openCompare }}\" style=\"{{ ghostBtnStyle }}\">👀 Compare types<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onShare }}\" disabled=\"{{ shareBusy }}\" style=\"{{ shareBtnStyle }}\">{{ shareLabel }}<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ onRestartClick }}\" style=\"{{ ghostBtnStyle }}\">↻ Create another<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff;border-radius:30px;padding:clamp(24px,5vw,50px);box-shadow:0 20px 50px rgba(60,45,10,.1);position:relative;overflow:hidden\">\n          <div style=\"position:absolute;width:190px;height:190px;border-radius:50%;background:#eaf9ee;right:-90px;top:-85px\"><\u002Fdiv>\n\n          <sc-if value=\"{{ showRibbon }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"{{ ribbonStyle }}\">✦ Aspiration unlocked — {{ dreamAchievement }}<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <div style=\"position:relative;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid #efe6d3;padding-bottom:22px;margin:0 0 24px\">\n            <div>\n              <h3 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:clamp(30px,5.5vw,46px);margin:0 0 8px;line-height:1\">{{ cvName }}<\u002Fh3>\n              <p style=\"color:{{ accent }};font-weight:700;margin:0;font-family:Fredoka,sans-serif\">{{ cvTitle }}<\u002Fp>\n            <\u002Fdiv>\n            <span style=\"font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:700;background:#eaf9ee;color:#1f9750;padding:8px 12px;border-radius:12px;white-space:nowrap\">{{ cvType }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <p style=\"max-width:680px;color:#5a5346;line-height:1.6;margin:0 0 28px\"><b>Professional summary:<\u002Fb> {{ cvSummary }}<\u002Fp>\n\n          <div style=\"display:grid;gap:22px\">\n            <sc-for list=\"{{ cvSections }}\" as=\"sec\" hint-placeholder-count=\"5\">\n              <div>\n                <h4 style=\"display:flex;align-items:center;gap:8px;font-family:Fredoka,sans-serif;font-size:13px;margin:0 0 12px;text-transform:uppercase;letter-spacing:1px;color:{{ sec.headColor }}\"><span style=\"{{ diamondBulletStyle }}\"><\u002Fspan>{{ sec.title }}<\u002Fh4>\n\n                <sc-if value=\"{{ sec.isSkills }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:grid;gap:10px;max-width:440px\">\n                    <sc-for list=\"{{ sec.bars }}\" as=\"b\" hint-placeholder-count=\"5\">\n                      <div>\n                        <div style=\"display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px\"><span>{{ b.label }}<\u002Fspan><\u002Fdiv>\n                        <div style=\"height:11px;border-radius:8px;background:#f1ece0;overflow:hidden\"><div style=\"{{ b.fillStyle }}\"><\u002Fdiv><\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ sec.isList }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;flex-wrap:wrap;gap:9px\">\n                    <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <span style=\"display:flex;align-items:center;gap:6px;font-size:13.5px;background:#f7f3e8;padding:8px 12px;border-radius:12px;font-weight:600\"><span style=\"{{ smallDiamondStyle }}\"><\u002Fspan>{{ it }}<\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ sec.isExperience }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:grid;gap:14px\">\n                    <sc-for list=\"{{ sec.items }}\" as=\"it\" hint-placeholder-count=\"2\">\n                      <div style=\"border-left:3px solid {{ accent }};padding-left:14px\">\n                        <b style=\"font-size:14.5px\">{{ it.role }}<\u002Fb>\n                        <p style=\"margin:3px 0 0;font-size:13.5px;color:#6a6353;line-height:1.5\">{{ it.desc }}<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ sec.isText }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"{{ speechCardStyle }}\">{{ sec.text }}<\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ sec.isDream }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"{{ dreamCardStyle }}\">{{ sec.text }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"{{ vocabCardStyle }}\">\n          <b style=\"display:block;font-family:Fredoka,sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:#a8730a;margin-bottom:9px\">📚 Words from your CV<\u002Fb>\n          <sc-for list=\"{{ vocabItems }}\" as=\"voc\" hint-placeholder-count=\"3\">\n            <div style=\"font-size:14px;color:#6a6046;line-height:1.5;margin-bottom:5px\"><b style=\"font-family:'DM Sans',sans-serif\">{{ voc.phrase }}<\u002Fb> — {{ voc.meaning }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ toastShow }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:26px;transform:translateX(-50%);animation:toastIn .3s ease;background:#2c2417;color:#fff;padding:13px 19px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:0 15px 35px rgba(0,0,0,.25);z-index:30;font-family:'DM Sans',sans-serif\">{{ toastMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ compareOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(40,30,10,.4);backdrop-filter:blur(3px);z-index:20;display:flex;align-items:center;justify-content:center;padding:20px\" sc-camel-on-click=\"{{ closeCompareBackdrop }}\">\n      <div style=\"background:#fff;border-radius:28px;max-width:820px;width:100%;padding:32px;box-shadow:0 30px 70px rgba(30,20,5,.3);position:relative\" sc-camel-on-click=\"{{ stopClick }}\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeCompare }}\" aria-label=\"Close\" style=\"position:absolute;right:16px;top:14px;border:0;background:#f4efe2;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer\">×<\u002Fbutton>\n        <p style=\"text-transform:uppercase;letter-spacing:1.5px;color:{{ accent }};font-size:12px;font-weight:700;margin:0 0 8px\">Quick CV guide<\u002Fp>\n        <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:30px;margin:0 0 10px\">Choose an aspiration track<\u002Fh2>\n        <p style=\"color:#7c7362;margin:0 0 22px\">Every CV has a summary — the order changes what people notice first.<\u002Fp>\n\n        <div class=\"comparison-grid\" style=\"display:grid;gap:12px\">\n          <sc-for list=\"{{ compareOptions }}\" as=\"co\" hint-placeholder-count=\"3\">\n            <button type=\"button\" sc-camel-on-click=\"{{ co.onClick }}\" style=\"{{ co.tileStyle }}\">\n              <span style=\"font-size:26px\">{{ co.icon }}<\u002Fspan>\n              <h3 style=\"font-family:Fredoka,sans-serif;font-size:19px;margin:8px 0 2px\">{{ co.title }}<\u002Fh3>\n              <b style=\"font-size:12.5px;color:{{ accent }}\">{{ co.sub }}<\u002Fb>\n              <p style=\"font-size:12.5px;line-height:1.4;color:#7c7362;margin:10px 0 0\">{{ co.desc }}<\u002Fp>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"{{ compareDetailStyle }}\">{{ compareDetailText }}<\u002Fdiv>\n        <button type=\"button\" sc-camel-on-click=\"{{ confirmCompare }}\" disabled=\"{{ compareConfirmDisabled }}\" style=\"{{ confirmBtnStyle }}\">Use this CV type <span style=\"margin-left:10px\">→<\u002Fspan><\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ shareOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;inset:0;background:rgba(40,30,10,.48);backdrop-filter:blur(4px);z-index:20;overflow:auto;padding:24px\">\n      <div style=\"position:relative;max-width:520px;margin:30px auto;background:#fff;border-radius:26px;padding:26px;box-shadow:0 25px 70px rgba(30,20,5,.3)\">\n        <button type=\"button\" sc-camel-on-click=\"{{ closeShare }}\" aria-label=\"Close preview\" style=\"position:absolute;right:16px;top:14px;border:0;background:#f4efe2;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer\">×<\u002Fbutton>\n        <p style=\"text-transform:uppercase;letter-spacing:1.5px;color:{{ accent }};font-size:12px;font-weight:700;margin:0 0 8px\">Ready to share<\u002Fp>\n        <h2 style=\"font-family:Fredoka,sans-serif;font-weight:600;font-size:28px;margin:0 0 16px\">Your Dream CV card<\u002Fh2>\n        <sc-if value=\"{{ hasShareUrl }}\" hint-placeholder-val=\"{{ false }}\">\n          <img ref=\"{{ shareImgRef }}\" alt=\"Preview of your Dream CV share card\" style=\"width:100%;display:block;border-radius:16px;border:1px solid #efe6d3\">\n        <\u002Fsc-if>\n        <div style=\"display:flex;justify-content:space-between;gap:10px;margin-top:18px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ closeShare }}\" style=\"{{ ghostBtnStyle }}\">Keep editing<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ doShare }}\" style=\"{{ primaryBtnStyle }}\">Share or download <span style=\"margin-left:10px\">→<\u002Fspan><\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2fbf67&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2fbf67&quot;,&quot;#4fa3e0&quot;,&quot;#f5a623&quot;,&quot;#ff8fae&quot;]},&quot;showRibbon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst capFirst = s => s.charAt(0).toUpperCase()+s.slice(1);\nconst lowerFirst = s => s.charAt(0).toLowerCase()+s.slice(1);\nconst withArticle = word => (/^[aeiou]/i.test(word)?'an ':'a ')+word;\nconst firstSentence = text => { const i = text.indexOf('. '); return i===-1 ? text : text.slice(0, i+1); };\nclass Component extends DCLogic {\n  state = { screen:'welcome', step:0, selections:{}, compareOpen:false, compareType:null, shareOpen:false, shareUrl:null, shareBusy:false, toastShow:false, toastMsg:'' };\n\n  steps = [\n    {key:'style', label:'Style', title:'Choose your personal style', hint:\"There is no wrong answer. Pick what feels most like you.\", options:[['✨','Creative'],['📚','Curious'],['🎯','Organized'],['🤝','Social'],['🌱','Calm'],['🚀','Adventurous'],['💡','Innovative'],['🎨','Expressive']]},\n    {key:'activity', label:'Activity', title:'Choose your favorite activity', hint:'What would you happily spend an afternoon doing?', options:[['📷','Photography'],['✍️','Writing'],['🎵','Music'],['🧁','Baking'],['🧳','Traveling'],['📚','Reading'],['🎨','Design'],['🌿','Gardening'],['☕','Discovering Cafés'],['🎬','Cinema']]},\n    {key:'project', label:'Dream project', title:'Choose a dream project', hint:'Choose a project your future self would love to try.', options:[['📖','Publish a Book'],['🎤','Host a Podcast'],['📸','Create a Photo Exhibition'],['🌎','Travel Around the World'],['🎨','Launch a Creative Brand'],['☕','Open a Cozy Café'],['🎵','Organize a Music Festival'],['📰','Create a Digital Magazine'],['🎬','Produce a Documentary'],['📚','Build a Community Library']]},\n    {key:'type', label:'CV type', title:'Choose a CV type', hint:'Each format tells your story in a different order.', options:[['📅','Chronological CV','Focuses on experience and achievements over time.'],['🛠','Functional CV','Focuses on skills and strengths.'],['🔀','Combined CV','Mixes skills and experience.']]}\n  ];\n\n  data = {\n    Photography:{title:'Aspiring Photographer', skills:['Visual storytelling','Creative composition','Photo editing','Project planning','Attention to detail'], exp:[['Photography Club Member','Took photos at school events and a few personal projects, trying to catch everyday moments that would otherwise get forgotten. Spent a lot of time just learning to wait for the right light.'],['Community Event Volunteer','Photographed workshops and local events, and got good at putting nervous first-timers at ease in front of the camera. Edited the photos afterward and sent organizers a small gallery to keep.']],\n      archetype:{motivation:'noticing the small moments other people rush past', strengths:['Notices the moment right before or right after the \"obvious\" one.','Remembers small details from places most people forget instantly.','Would rather wait five extra minutes for the right light than rush a shot.','Keeps old photos around long after everyone else has deleted theirs.','Notices when a room changes mood, even without being told why.'], facts:['Has a phone full of photos of the same sunset from slightly different angles.','Can spot a good photo opportunity in the most boring parking lot.','Keeps meaning to print photos and still has not.','Picks things up about a place just by spending an afternoon photographing it.']}},\n    Writing:{title:'Creative Storyteller',skills:['Narrative writing','Research','Communication','Editing','Creative thinking'],exp:[['Blog Contributor','Published short articles about ideas, places, and everyday life, mostly for people who like an easy read. Pitched a lot of topics that never got published, and a few that did.'],['Writing Club Member','Read other people\\u2019s drafts in a writing group and tried to give feedback that was actually useful, not just nice. Came up with a few writing prompts when nobody else had ideas.']],\n      archetype:{motivation:'turning ordinary moments into stories worth telling', strengths:['Turns a boring afternoon into a decent story by the time it is retold.','Remembers conversations well enough to repeat them almost word for word.','Rewrites the same sentence five times before moving on.','Notices when a story is missing its ending before anyone else does.','Collects overheard lines that end up in something later.','Notices headlines other people scroll straight past.'], facts:['Has a note app full of half sentences that made sense at 2am.','Rereads old journal entries and cringes, then keeps writing anyway.','Can turn a two-minute story into a ten-minute one, on purpose.']}},\n    Music:{title:'Music Festival Dreamer',skills:['Event coordination','Collaboration','Creative programming','Communication','Planning'],exp:[['Music Club Member','Helped pick songs for a few listening sessions, mostly genres nobody else in class had heard yet. Tried to keep everyone happy, which never fully works.'],['Community Event Volunteer','Helped set up sound equipment and keep the schedule at a few small live events. Mostly just tried to keep performers from running late.']],\n      archetype:{motivation:'finding the right thing to share with a room full of different people', strengths:['Can tell within thirty seconds whether a song fits the room.','Remembers a song by the moment it was playing, not just the lyrics.','Notices when someone in the group is being left out of the playlist debate.','Keeps a mental list of songs for very specific, oddly niche moods.','Will happily rebuild a whole setlist to fix one bad transition.','Notices the room needs a mood change at the last minute and scrambles the playlist.'], facts:['Has a playlist named something only they understand anymore.','Can identify a song within the first two seconds, most of the time.','Has strong, mostly unshared opinions about transition timing.']}},\n    Baking:{title:'Future Café Owner',skills:['Recipe development','Creativity','Time management','Customer care','Organization'],exp:[['Baking Club Member','Tried out a lot of simple recipes and brought the good ones to community events. Kept a notebook of what worked and what definitely didn\\u2019t.'],['Café Project Volunteer','Helped plan a small café menu and layout for a school project, mostly arguing about what should go on it. Spent way too long deciding how things should be plated.']],\n      archetype:{motivation:'making a small space feel like it was made for whoever walks in', strengths:['Notices who has not eaten yet before anyone says anything.','Remembers exactly how someone likes their coffee after one visit.','Keeps tweaking a recipe long after everyone says it is already good.','Makes sure there is always a little extra for whoever shows up late.','Notices when a room needs something warm in it, literally or otherwise.'], facts:['Has strong opinions about the correct texture of a cookie.','Keeps a mental list of who prefers what, without writing it down.','Has ruined at least one batch trying to fix a batch that was already fine.']}},\n    Traveling:{title:'Curious Explorer',skills:['Adaptability','Trip planning','Research','Cross-cultural communication','Problem solving'],exp:[['Travel Blog Contributor','Wrote a few practical travel guides with favorite local spots worth checking out. Double-checked most of the recommendations before publishing, after getting one wrong once.'],['Cultural Event Volunteer','Helped visitors from different backgrounds find things to do that actually matched what they were interested in. Got asked a lot of last-minute questions, most of which had good answers.']],\n      archetype:{motivation:'understanding how people build a life for themselves, wherever they are', strengths:['Asks locals more questions than the guidebook answers.','Notices the small daily habits that make a new place feel different.','Would rather get slightly lost than follow the obvious route.','Remembers a place by one small, specific detail nobody else noticed.','Keeps comparing new places back to the last one, out loud, unprompted.'], facts:['Has a note somewhere with a stranger\\u2019s restaurant recommendation from years ago.','Packs light and still somehow overpacks.','Can find the local favorite spot within a day of arriving anywhere.','Keeps a running list of tiny travel details other people forget.']}},\n    Reading:{title:'Community Book Lover',skills:['Critical analysis','Communication','Organization','Discussion facilitation','Planning'],exp:[['Book Club Member','Led a few book club conversations, usually more prepared than necessary. Tried to get the quieter members talking too, with mixed results.'],['Library Volunteer','Reorganized some shelves and put together a few themed displays, partly because the old ones bothered me. Helped visitors track down a book they half-remembered the cover of.']],\n      archetype:{motivation:'chasing one good idea back to wherever it actually came from', strengths:['Follows one footnote until it becomes an entirely different afternoon.','Remembers which book a random fact came from, months later.','Keeps reading past the point where the answer was already found.','Notices when an argument has a hole in it, even in a good book.','Recommends books based on a five-minute read of someone\\u2019s mood.','Rarely gives up on a book, even a bad one.'], facts:['Has at least three books going at once, on purpose.','Dog-ears pages, then feels guilty about it, then does it again.','Can quote a favorite line but never remembers where it is from.']}},\n    Design:{title:'Creative Brand Builder',skills:['Visual design','Creative thinking','Communication','Problem solving','Planning'],exp:[['Design Club Member','Designed posters and visuals for a few school projects, usually starting from someone\\u2019s rough sketch. Tried to keep a similar style across all of them, not always successfully.'],['Creative Workshop Volunteer','Put together templates and materials so beginners could join creative sessions without feeling lost. Gave feedback when asked, and tried not to be too honest about the bad ideas.']],\n      archetype:{motivation:'making a rough idea look like it was always meant to exist', strengths:['Notices when spacing is off by a few pixels, unprompted.','Keeps redoing a layout that already looked fine to everyone else.','Can explain exactly why one version works better than another.','Collects inspiration from places that have nothing to do with the project.','Would rather start over than patch something that is not quite right.'], facts:['Has strong opinions about fonts that nobody asked for.','Keeps a folder of \"inspiration\" that is mostly unrelated screenshots.','Notices bad spacing in places most people would never look.','Turns any car ride into an impromptu brainstorming session for the next project.','Keeps a folder of half-finished projects that seemed important at the time.']}},\n    Gardening:{title:'Calm Community Creator',skills:['Planning','Teamwork','Attention to detail','Adaptability','Organization'],exp:[['Community Garden Volunteer','Helped take care of plants and figure out a low-maintenance layout for a neighborhood green space. Wrote down what survived each season and what quietly didn\\u2019t.'],['Eco Club Member','Made a few posters about nature and small sustainability ideas anyone could actually do. Helped organize small clean-up days, usually smaller than planned.']],\n      archetype:{motivation:'understanding how people turn a shared space into somewhere they belong', strengths:['Makes people feel included without making a big deal about it.','Notices when someone is standing at the edge of a group, unsure.','Remembers who was there the first time, even years later.','Keeps showing up to the same shared space, week after week.','Would rather fix something quietly than take credit for fixing it.','Ends up organizing the whole clean-up day without meaning to.'], facts:['Knows most of the neighbors by name, and most of their plants too.','Has strong opinions about whose tomatoes are actually doing well.','Keeps a small stash of seeds for whoever asks.']}},\n    'Discovering Cafés':{title:'Future Café Owner',skills:['Customer care','Research','Communication','Creativity','Planning'],exp:[['Café Explorer','Kept a notebook of favorite cosy cafés — the menu, the seating, small details worth remembering. Turned it into a list of recommendations friends actually asked for.'],['Community Event Volunteer','Helped welcome guests at a few local events and tried to make newcomers feel less awkward standing alone. Handled the small last-minute details nobody else wanted to deal with.']],\n      archetype:{motivation:'noticing the small details that make a place feel like somewhere, not just anywhere', strengths:['Notices the small details that make a place feel like somewhere.','Remembers exactly which seat by the window was the good one.','Can tell within a few minutes whether a new place has \"it.\"','Keeps a running mental list of places worth going back to.','Notices when a place is trying too hard, or not hard enough.','Notices when a caf\\u00e9\\u2019s playlist feels a little off before anyone else does.'], facts:['Has a favorite order at more cafés than is probably reasonable.','Judges a place by its playlist, fairly or not.','Keeps meaning to write a proper list and instead just remembers it all.']}},\n    Cinema:{title:'Aspiring Documentary Maker',skills:['Visual storytelling','Research','Directing basics','Communication','Planning'],exp:[['Film Club Member','Talked through films in way too much detail with a small team and pitched a few short video ideas. Helped turn the better ones into an actual shot list.'],['Community Event Volunteer','Helped run a film screening at a small local event and fixed a few last-minute technical problems, mostly by unplugging and replugging things. Introduced each film with a short note, usually written five minutes beforehand.']],\n      archetype:{motivation:'chasing down the story hiding inside an ordinary moment', strengths:['Notices the small detail in a scene that explains everything later.','Remembers a film by one shot, not the whole plot.','Would rather rewatch a favorite than start something new and risk it.','Still thinking about an ending long after everyone else has moved on.','Notices when a story is borrowing from somewhere else, usually correctly.'], facts:['Has opinions about directors that come up more than anyone asked for.','Rewatches the same three films more than anything new.','Notices continuity errors and immediately needs to mention them.']}}\n  };\n  achievements = {'Publish a Book':'Publish a bestselling novel that turns one good idea into a story readers cannot put down','Host a Podcast':'Host an inspiring podcast full of conversations that feel like catching up with old friends','Create a Photo Exhibition':'Create a photo exhibition that turns strangers into people swapping stories','Travel Around the World':'Visit 50 countries and collect a small, honest story from each one','Launch a Creative Brand':'Launch a creative brand built on ideas strong enough to outgrow a single bedroom studio','Open a Cozy Café':'Open a cozy neighborhood café where regulars start calling it their own within a week','Organize a Music Festival':'Organize a community music festival with one stage and a lineup nobody saw coming','Create a Digital Magazine':'Create a digital magazine that gives new writers their very first byline','Produce a Documentary':'Produce a documentary worth sitting through the credits to think about','Build a Community Library':'Build a welcoming community library stocked with exactly what the neighborhood needs'};\n  names = ['Emma','Sofia','Maya','Olivia','Luna','Chloe','Isabella','Noah','Leo','Mila','Ethan','Amelia'];\n  styleMeta = {Creative:{synonym:'imaginative',trait:'turning fresh ideas into real, finished projects'},Curious:{synonym:'inquisitive',trait:'asking good questions and then finding out the answers'},Organized:{synonym:'methodical',trait:'keeping every project mapped out and on track'},Social:{synonym:'personable',trait:'building warm, easy connections with new people'},Calm:{synonym:'composed',trait:'staying steady and thoughtful even when plans change'},Adventurous:{synonym:'intrepid',trait:'chasing new challenges without waiting for permission'},Innovative:{synonym:'resourceful',trait:'reimagining ordinary tasks in original ways'},Expressive:{synonym:'articulate',trait:'putting big ideas into words other people remember'}};\n  bonusSkillPool = ['Quick thinking','Steady focus','Clear communication','Careful editing','Fresh ideas','Practical planning','Active listening','Honest feedback','Time management','Pattern spotting','Calm troubleshooting','Extra patience'];\n  styleSkill = {Creative:'Idea generation', Curious:'Research instincts', Organized:'Process design', Social:'Relationship building', Calm:'Steady decision-making', Adventurous:'Calculated risk-taking', Innovative:'Creative problem-solving', Expressive:'Persuasive storytelling'};\n  dreamLeadIns = ['Someday:','The big one:','Still dreaming about:','One day, hopefully:','Somewhere down the line:','What comes next:'];\n  sectionLabels = {'Chronological CV':{skills:'Key Skills', experience:'Career Timeline', strengths:'Standout Qualities'},'Functional CV':{skills:'Core Strengths', experience:'Proven Experience', strengths:'Top Traits'},'Combined CV':{skills:'Abilities', experience:'Track Record', strengths:'What Sets This Apart'}};\n  summaryTemplates = {\n    'Chronological CV': (name, style, meta, activityLower) => [\n      `${name} got into ${activityLower} a while back and never really stopped — these days it looks a lot like ${meta.trait}.`,\n      `It started small: a bit of ${activityLower} here and there. Somewhere along the way, ${name} ended up ${meta.trait}.`,\n      `${name} has been into ${activityLower} for as long as anyone can remember, always ${meta.trait}. Some people just call that ${meta.synonym}.`,\n      `Ask ${name} how it all began and the answer is always ${activityLower}. One thing led to another, mostly ${meta.trait} along the way.`\n    ],\n    'Functional CV': (name, style, meta, activityLower) => [\n      `${name} is the kind of ${style.toLowerCase()} person who ends up ${meta.trait} without really trying.`,\n      `Ask around and people will say ${name} is good at ${activityLower} — mostly because of a habit of ${meta.trait}. Call it ${meta.synonym} if you want a word for it.`,\n      `${name}'s thing is ${activityLower}, and it shows: always ${meta.trait}.`,\n      `What ${name} is actually good at does not always show up on paper — it looks more like ${meta.trait}, especially around ${activityLower}.`\n    ],\n    'Combined CV': (name, style, meta, activityLower) => [\n      `${name} has picked up ${activityLower} through a mix of trying things and paying attention, which mostly means ${meta.trait}. If that sounds ${meta.synonym}, it probably is.`,\n      `Half habit, half practice: ${name}'s relationship with ${activityLower} comes down to ${meta.trait}, learned by doing it, not reading about it.`,\n      `${name} learned ${activityLower} the same way most people learn anything worth learning — a little bit at a time, mostly by ${meta.trait}.`,\n      `Somewhere between ${style.toLowerCase()} instinct and real practice, ${name} ended up ${meta.trait} through ${activityLower}.`\n    ]\n  };\n  connector = {\n    'Chronological CV': [\n      (motivation, dreamLower) => `That same instinct — ${motivation} — is part of why the plan is to ${dreamLower}.`,\n      (motivation, dreamLower) => `It comes back to ${motivation}, which is part of why the next step is to ${dreamLower}.`\n    ],\n    'Functional CV': [\n      (motivation, dreamLower) => `Strip away the details and it comes down to ${motivation} — part of why the goal is to ${dreamLower}.`,\n      (motivation, dreamLower) => `That is the real thing underneath it all: ${motivation}. It shapes the goal to ${dreamLower}, too.`\n    ],\n    'Combined CV': [\n      (motivation, dreamLower) => `Both the everyday work and the bigger dream trace back to the same thing: ${motivation}. It shapes the goal to ${dreamLower}.`,\n      (motivation, dreamLower) => `Whether it is the day-to-day or the big dream, it circles back to ${motivation} — which plays into wanting to ${dreamLower}.`\n    ]\n  };\n  compareMeta = [\n    {key:'chronological', icon:'📅', title:'Chronological', sub:'Experience comes first', desc:'Useful for a steady work history where recent progress should stand out first.', detail:'Experience takes center stage, tracing a career path from the newest projects back to earlier ones. Ideal for showing steady, consistent progress.', cvType:'Chronological CV'},\n    {key:'functional', icon:'🛠', title:'Functional', sub:'Skills come first', desc:'Useful for letting strengths speak louder than the timeline.', detail:'Skills take center stage, useful when strengths and transferable abilities should matter more than exact dates.', andle or take care of a problem or situation'],\n    ['talked through', 'discussed something in detail, step by step'],\n    ['part of why', 'one of the reasons, though not the only one'],\n    ['trace back to', 'can be followed back to an original cause or source'],\n    ['circles back to', 'returns to the same idea or topic'],\n    ['plays into', 'is one of the reasons behind something, or supports it'],\n    ['underneath it all', 'at the most basic or true level, once everything else is set aside'],\n    ['rush past', 'move by quickly, without stopping to notice'],\n    ['word for word', 'using the exact same words, without changing anything'],\n    ['left out', 'not included in a group or activity'],\n    ['hole in it', 'a weak or missing part in an argument or plan'],\n    ['start over', 'begin again from the beginning'],\n    ['take credit for', 'let people think you are responsible for something good'],\n    ['stash of', 'a hidden or private supply of something'],\n    ['nobody asked for', 'unwanted or unrequested, but given anyway'],\n    ['point to', 'identify or indicate something as the cause or source'],\n    ['over the years', 'during a long period of time'],\n    ['shows up', 'appears or becomes noticeable'],\n    ['early on', 'at an early stage, near the beginning'],\n    ['keeps going', 'continues, without stopping'],\n    ['strip away', 'remove extra parts to reveal the basic truth underneath'],\n    ['borrowing from', 'taking ideas or style from another source']\n  ];\n  pickVocab(text){\n    const t = (text||'').toLowerCase();\n    const matches = this.vocabGlossary.filter(([phrase]) => t.includes(phrase));\n    return [...matches].sort(() => Math.random()-0.5).map(([phrase,meaning]) => ({phrase, meaning}));\n  }\n\n  random(a){ return a[Math.floor(Math.random()*a.length)]; }\n\n  pickStrengths(style, archetype){\n    const meta = this.styleMeta[style];\n    const signature = meta ? capFirst(meta.trait) + '.' : 'Usually finds a way to adapt when plans change.';\n    const pool = archetype.strengths.filter(x => x !== signature);\n    const shuffled = [...pool].sort(() => Math.random()-0.5);\n    return [signature, ...shuffled.slice(0,2)];\n  }\n  summaryFlavor = {\n    'Chronological CV': [\n      'Nothing about it happened overnight — it just added up, one small step after another.',\n      'Anyone who has known them a while can point to the exact moment it started.',\n      'It is less a straight line and more a habit that stuck.',\n      'Ask what changed over the years and the honest answer is: not much, just more of it.'\n    ],\n    'Functional CV': [\n      'It rarely looks like effort from the outside — more like something they just do without noticing.',\n      'Give them a problem in this area and they will quietly figure it out before anyone asks.',\n      'It shows up in small ways more than big announcements.',\n      'Nobody had to teach them this part — it just clicked early on.'\n    ],\n    'Combined CV': [\n      'Some of it came from doing, some from just paying attention — hard to say which mattered more.',\n      'It is not one thing or the other, more like both at once, most of the time.',\n      'Half of it is instinct, the other half is just repetition.',\n      'It is hard to tell where the practice ends and the natural part begins.'\n    ]\n  };\n  skillNote = {\n    'Chronological CV': (a, b) => `Spends a lot of time on ${a} and ${b}, picked up mostly the hard way.`,\n    'Functional CV': (a, b) => `Especially good at ${a} and ${b} — the kind of thing that just comes naturally.`,\n    'Combined CV': (a, b) => `Somewhere between ${a} and ${b} is where most of the real learning happened, half instinct and half practice.`\n  };\n  summaryClosing = {\n    'Chronological CV': [\n      'Still keeps at it, even on the days it would be easier not to.',\n      'Has a habit of finishing what gets started, eventually.',\n      'Picked up most of it the hard way — by doing, not by planning.',\n      'The kind of person who shows up again the next day and keeps going.'\n    ],\n    'Functional CV': [\n      'Has a real knack for figuring out the parts other people skip.',\n      'Picks up on things fast, then quietly gets better at them.',\n      'The one people ask first when something needs sorting out.',\n      'Notices the small stuff most people walk right past.'\n    ],\n    'Combined CV': [\n      'Learned some of it on purpose and some of it by accident, and both stuck.',\n      'Sticks with things long enough to actually get good at them.',\n      'Somewhere between practice and instinct, it just works.',\n      'Has a knack for it, and the hours put in back it up.'\n    ]\n  };\n  buildSummary(name, style, activity, dream, type, skills, archetype){\n    const meta = this.styleMeta[style] || {synonym:style.toLowerCase(), trait:'bringing ideas to life'};\n    const activityLower = activity.toLowerCase();\n    const dreamLower = lowerFirst(dream);\n    const pool = (this.summaryTemplates[type] || this.summaryTemplates['Combined CV'])(name, style, meta, activityLower);\n    const connectorPool = this.connector[type] || this.connector['Combined CV'];\n    const flavorPool = this.summaryFlavor[type] || this.summaryFlavor['Combined CV'];\n    const closingPool = this.summaryClosing[type] || this.summaryClosing['Combined CV'];\n    const connectorLine = this.random(connectorPool)(archetype.motivation, dreamLower);\n    const shuffledSkills = skills ? [...skills].sort(() => Math.random()-0.5) : [];\n    const [skillA, skillB] = shuffledSkills;\n    const skillLine = skillA && skillB ? ' ' + (this.skillNote[type] || this.skillNote['Combined CV'])(skillA, skillB) : '';\n    return `${this.random(pool)} ${connectorLine} ${this.random(flavorPool)}${skillLine} ${this.random(closingPool)}`;\n  }\n\n  onStart(){ this.setState({ screen:'builder', step:0 }); }\n  onRestartClick(e){ if(e&&e.preventDefault) e.preventDefault(); this._cvName=null; this._strengths=null; this._fact=null; this._cvSummary=null; this._dreamLeadIn=null; this._vocabPicks=null; this.setState({ screen:'welcome', step:0, selections:{} }); }\n  selectOption(idx){\n    const step = this.steps[this.state.step];\n    const val = step.options[idx][1];\n    this.setState(s => ({ selections: {...s.selections, [step.key]: val} }));\n  }\n  onNext(){\n    if(this.state.step === 3){ this.createCV(); return; }\n    this.setState(s => ({ step: s.step + 1 }));\n  }\n  onBack(){ if(this.state.step) this.setState(s => ({ step: s.step - 1 })); }\n  surprise(){\n    const sel = {};\n    this.steps.forEach(s => { sel[s.key] = this.random(s.options)[1]; });\n    this.setState({ selections: sel }, () => this.createCV());\n  }\n  createCV(){ this._cvName=null; this._strengths=null; this._fact=null; this._cvSummary=null; this._dreamLeadIn=null; this._vocabPicks=null; this.setState({ screen:'result' }); }\n\n  openCompare(){ this.setState({ compareOpen:true, compareType:null }); }\n  closeCompare(){ this.setState({ compareOpen:false }); }\n  pickCompareType(key){ this.setState({ compareType:key }); }\n  confirmCompare(){\n    if(!this.state.compareType) return;\n    const meta = this.compareMeta.find(c => c.key === this.state.compareType);\n    this.setState(s => ({ selections: {...s.selections, type: meta.cvType}, compareOpen:false }));\n  }\n\n  showToast(msg){\n    this.setState({ toastShow:true, toastMsg: msg });\n    clearTimeout(this._toastTimer);\n    this._toastTimer = setTimeout(() => this.setState({ toastShow:false }), 2800);\n  }\n\n  drawDiamond(c, cx, cy, r, color1, color2){\n    c.save(); c.translate(cx,cy);\n    c.fillStyle = color2 ? c.createLinearGradient(-r,-r,r,r) : color1;\n    if(color2){ const g = c.createLinearGradient(-r,-r,r,r); g.addColorStop(0,color1); g.addColorStop(1,color2); c.fillStyle = g; }\n    c.beginPath(); c.moveTo(0,-r); c.lineTo(r,0); c.lineTo(0,r); c.lineTo(-r,0); c.closePath(); c.fill();\n    c.restore();\n  }\n  buildCVData(sel){\n    const accentDark = '#1f9750';\n    const d = this.data[sel.activity];\n    if(!d) return { name:'', title:'', summary:'', sections:[], vocabItems:[] };\n    const name = this._cvName || (this._cvName = this.random(this.names));\n    const strengths = this._strengths || (this._strengths = this.pickStrengths(sel.style, d.archetype));\n    const fact = this._fact || (this._fact = this.random(d.archetype.facts));\n    const summary = this._cvSummary || (this._cvSummary = this.buildSummary(name, sel.style, sel.activity, this.achievements[sel.project]||'', sel.type, d.skills, d.archetype));\n    const labels = this.sectionLabels[sel.type] || {};\n    const isFunctional = sel.type === 'Functional CV';\n    const isChronological = sel.type === 'Chronological CV';\n    const bars = d.skills.map((label, i) => ({ label, fillStyle:`height:100%;width:${[92,85,78,88,70][i%5]}%;border-radius:8px;background:${this.barColors[i%5]}` }));\n    const styleTag = this.styleSkill[sel.style];\n    if(styleTag && !bars.some(b=>b.label===styleTag)) bars.push({ label:styleTag, fillStyle:`height:100%;width:80%;border-radius:8px;background:${this.barColors[bars.length%5]}` });\n    if(isFunctional){\n      const bonusPool = this.bonusSkillPool.filter(x => !bars.some(b=>b.label===x));\n      if(bonusPool.length){ const bonus = this.random(bonusPool); bars.push({ label:bonus, fillStyle:`height:100%;width:75%;border-radius:8px;background:${this.barColors[bars.length%5]}` }); }\n    }\n    const dateLabels = ['2026','2025'];\n    const expItems = d.exp.map((x,i) => ({\n      role:x[0],\n      desc: isFunctional ? firstSentence(x[1]) : isChronological ? `${dateLabels[i]||'2024'} — ${x[1]}` : x[1]\n    }));\n    const dreamLine = (this._dreamLeadIn || (this._dreamLeadIn = this.random(this.dreamLeadIns))) + ' ' + (this.achievements[sel.project]||'') + '.';\n    const sectionsMap = {\n      skills:{ title: labels.skills||'Skills', isSkills:true, bars, headColor:accentDark },\n      strengths:{ title: labels.strengths||'Strengths', isList:true, items:strengths, headColor:accentDark },\n      experience:{ title: labels.experience||'Experience', isExperience:true, items:expItems, headColor:accentDark },\n      fun:{ title:'Fun Fact', isText:true, text:fact, headColor:accentDark },\n      dream:{ title:'Dream Achievement', isDream:true, text:dreamLine, headColor:'#a8730a' }\n    };\n    const order = sel.type==='Chronological CV' ? ['experience','skills','strengths','fun','dream'] : sel.type==='Functional CV' ? ['skills','strengths','experience','fun','dream'] : ['skills','experience','strengths','fun','dream'];\n    const vocabScanText = [summary, fact, dreamLine, ...expItems.map(x=>x.desc), ...strengths, ...bars.map(b=>b.label)].join(' ');\n    const vocabItems = this._vocabPicks || (this._vocabPicks = this.pickVocab(vocabScanText));\n    return { name, title:d.title, summary, sections: order.map(k=>sectionsMap[k]), vocabItems };\n  }\n  drawCVBody(c, cv, draw){\n    const marginX = 120, contentW = 820;\n    const measureLines = (text, width) => {\n      const words = text.split(' '); let line=''; let count=0;\n      for(const w of words){ const next = line ? line+' '+w : w;\n        if(c.measureText(next).width > width && line){ count++; line=w; } else line = next; }\n      if(line) count++;\n      return count;\n    };\n    const wrap = (text, x, y, width, lineHeight) => {\n      const words = text.split(' '); let line=''; let count=0;\n      for(const w of words){ const next = line ? line+' '+w : w;\n        if(c.measureText(next).width > width && line){ if(draw) c.fillText(line,x,y+count*lineHeight); count++; line=w; }\n        else line = next; }\n      if(line){ if(draw) c.fillText(line,x,y+count*lineHeight); count++; }\n      return y+count*lineHeight;\n    };\n\n    let y = 479;\n    if(draw) this.drawDiamond(c, 128, y-7, 8, '#f5a623', '#c9800a');\n    c.font = '700 21px \"Fredoka\",Arial';\n    if(draw){ c.fillStyle = '#1f9750'; c.fillText('PROFESSIONAL SUMMARY', 150, y); }\n    y += 46;\n    c.font = '24px Arial';\n    if(draw) c.fillStyle = '#5a5346';\n    y = wrap(cv.summary, marginX, y, contentW, 36) + 40;\n\n    cv.sections.forEach(sec => {\n      if(draw) this.drawDiamond(c, 128, y-7, 8, '#f5a623', '#c9800a');\n      c.font = '700 21px \"Fredoka\",Arial';\n      if(draw){ c.fillStyle = sec.headColor; c.fillText(sec.title.toUpperCase(), 150, y); }\n      y += 40;\n\n      if(sec.isSkills){\n        sec.bars.forEach((bar,i) => {\n          const widthFrac = [0.92,0.85,0.78,0.88,0.7][i%5];\n          c.font = '600 21px Arial';\n          if(draw){\n            c.fillStyle = '#5a4f3d'; c.fillText(bar.label, marginX, y);\n            c.fillStyle = '#f1ece0'; c.beginPath(); c.roundRect(marginX, y+12, contentW, 16, 8); c.fill();\n            c.fillStyle = this.barColors[i%5]; c.beginPath(); c.roundRect(marginX, y+12, contentW*widthFrac, 16, 8); c.fill();\n          }\n          y += 54;\n        });\n      } else if(sec.isList){\n        sec.items.forEach(item => {\n          c.font = '600 21px Arial';\n          if(draw){ c.fillStyle = '#5a4f3d'; c.fillText('✦  '+item, marginX, y); }\n          y += 36;\n        });\n      } else if(sec.isExperience){\n        sec.items.forEach(item => {\n          c.font = '700 21px Arial';\n          if(draw){ c.fillStyle = '#2c2417'; c.fillText(item.role, marginX, y); }\n          y += 30;\n          c.font = '19px Arial';\n          if(draw) c.fillStyle = '#6a6046';\n          y = wrap(item.desc, marginX, y, contentW, 26) + 20;\n        });\n      } else if(sec.isDream){\n        c.font = '24px Arial';\n        const dreamLines = measureLines(sec.text, 700);\n        const dreamBoxTop = y - 32;\n        const dreamBoxHeight = dreamLines*34 + 56;\n        if(draw){\n          c.fillStyle = '#fff8e7'; c.strokeStyle = '#f5a623'; c.lineWidth = 2;\n          c.beginPath(); c.roundRect(marginX, dreamBoxTop, contentW, dreamBoxHeight, 18); c.fill(); c.stroke();\n          c.fillStyle = '#6a5a2f'; c.textAlign = 'center';\n        }\n        const dreamTextTop = dreamBoxTop + (dreamBoxHeight - dreamLines*34)/2 + 24;\n        y = wrap(sec.text, 530, dreamTextTop, 700, 34);\n        if(draw) c.textAlign = 'left';\n        y += 20;\n      } else {\n        c.font = '24px Arial';\n        if(draw) c.fillStyle = '#5a5346';\n        y = wrap(sec.text, marginX, y, contentW, 34) + 20;\n      }\n      y += 36;\n    });\n\n    return y;\n  }\n  buildCanvasImage(){\n    const sel = this.state.selections;\n    const cv = this.buildCVData(sel);\n    const name = cv.name || 'Future Star';\n    const title = cv.title || 'Future Creator';\n    const type = sel.type || 'Dream CV';\n\n    // measure pass: run the body twice, first on a throwaway context just\n    // to find the required canvas height, matching how the split-file\n    // share.js version does it.\n    const scratch = document.createElement('canvas').getContext('2d');\n    const totalHeight = this.drawCVBody(scratch, cv, false) + 60;\n\n    const canvas = document.createElement('canvas'); canvas.width = 1080; canvas.height = totalHeight;\n    const c = canvas.getContext('2d');\n\n    c.fillStyle = '#fefaf1'; c.fillRect(0,0,1080,totalHeight);\n    c.fillStyle = '#eaf9ee'; c.beginPath(); c.arc(980,95,230,0,Math.PI*2); c.fill();\n    c.fillStyle = '#fdecc7'; c.beginPath(); c.arc(70,totalHeight-60,170,0,Math.PI*2); c.fill();\n    c.fillStyle = '#fff'; c.beginPath(); c.roundRect(58,60,964,totalHeight-120,42); c.fill();\n\n    c.save(); c.translate(128,120);\n    const g1 = c.createLinearGradient(-22,-22,22,22); g1.addColorStop(0,'#9df0a8'); g1.addColorStop(1,'#2fbf67');\n    c.fillStyle = g1; c.beginPath(); c.moveTo(0,-24); c.lineTo(24,0); c.lineTo(0,24); c.lineTo(-24,0); c.closePath(); c.fill();\n    c.restore();\n    c.fillStyle = '#1f9750'; c.font = '700 25px \"Fredoka\",Arial'; c.fillText('BUILD YOUR DREAM CV',172,128);\n\n    c.fillStyle = '#f5a623'; c.beginPath(); c.roundRect(120,168,560,52,16); c.fill();\n    this.drawDiamond(c, 152, 194, 11, '#fff', '#fff');\n    c.fillStyle = '#5c3d05'; c.font = '700 20px \"Fredoka\",Arial'; c.fillText('ASPIRATION UNLOCKED', 172, 201);\n\n    c.fillStyle = '#2c2417'; c.font = '700 74px \"Fredoka\",Georgia'; c.fillText(name,120,335);\n    c.fillStyle = '#1f9750'; c.font = '700 32px \"Fredoka\",Arial'; c.fillText(title,120,388);\n    c.font = '700 17px Arial'; const badgeText = type.toUpperCase();\n    const badgeW = c.measureText(badgeText).width + 40;\n    const badgeX = 940 - badgeW;\n    c.fillStyle = '#eaf9ee'; c.beginPath(); c.roundRect(badgeX,310,badgeW,48,22); c.fill();\n    c.fillStyle = '#1f9750'; c.fillText(badgeText,badgeX+20,340);\n    c.strokeStyle = '#efe6d3'; c.lineWidth=2; c.beginPath(); c.moveTo(120,432); c.lineTo(960,432); c.stroke();\n\n    this.drawCVBody(c, cv, true);\n\n    return canvas;\n  }\n  onShare(){\n    this.setState({ shareBusy:true });\n    setTimeout(() => {\n      const canvas = this.buildCanvasImage();\n      canvas.toBlob(blob => {\n        const url = URL.createObjectURL(blob);\n        if(this.state.shareUrl) URL.revokeObjectURL(this.state.shareUrl);\n        this._shareBlob = blob;\n        this.setState({ shareOpen:true, shareUrl:url, shareBusy:false });\n      }, 'image/png');\n    }, 50);\n  }\n  closeShare(){ this.setState({ shareOpen:false }); }\n  async doShare(){\n    if(!this._shareBlob) return;\n    const file = new File([this._shareBlob], 'my-dream-cv.png', { type:'image/png' });\n    try{\n      if(navigator.canShare && navigator.canShare({ files:[file] })){\n        await navigator.share({ title:'My Dream CV', text:'Here is my dream CV!', files:[file] });\n      } else {\n        const link = document.createElement('a'); link.href = this.state.shareUrl; link.download = file.name; link.click();\n        this.showToast('Image downloaded — send it in WhatsApp!');\n      }\n    } catch(e){ if(e.name !== 'AbortError') this.showToast('Could not share the image. Please try again.'); }\n  }\n\n  gemStyle(size, color1, color2, extra){\n    return `width:${size}px;height:${size}px;background:linear-gradient(135deg,${color1},${color2});clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);border-radius:2px;${extra||''}`;\n  }\n\n  renderVals(){\n    const accent = this.props.accent ?? '#2fbf67';\n    const accentDark = '#1f9750';\n    const gold = '#f5a623';\n    const s = this.state;\n    const sel = s.selections;\n\n    const primaryBtnStyle = `border:0;background:${accent};color:#0f3d20;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;padding:15px 22px;border-radius:16px;cursor:pointer;box-shadow:0 7px 0 ${accentDark};transition:.15s;display:inline-flex;align-items:center`;\n    const primaryBtnHover = `transform:translateY(-2px);box-shadow:0 9px 0 ${accentDark}`;\n    const primaryBtnActive = `transform:translateY(4px);box-shadow:0 3px 0 ${accentDark}`;\n    const ghostBtnStyle = `border:0;background:#f4efe2;color:#5a5346;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;padding:11px 15px;border-radius:14px;cursor:pointer`;\n    const backBtnStyle = `border:0;background:transparent;color:${accentDark};font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;padding:11px;border-radius:12px;cursor:pointer;visibility:${s.step?'visible':'hidden'}`;\n\n    const teaserBars = [\n      { label:'Creativity', fillStyle:`height:100%;width:78%;border-radius:8px;background:${accent}` },\n      { label:'Curiosity', fillStyle:'height:100%;width:64%;border-radius:8px;background:#4fa3e0' },\n      { label:'Confidence', fillStyle:'height:100%;width:88%;border-radius:8px;background:#f5a623' }\n    ];\n\n    const brandGemStyle = this.gemStyle(15, accent, accentDark, 'display:inline-block;box-shadow:0 2px 5px rgba(31,151,80,.4)');\n    const plumbobTopStyle = `position:absolute;left:50%;top:0;transform:translateX(-50%) rotate(45deg);width:50px;height:50px;background:linear-gradient(135deg,#9df0a8,${accent});border-radius:6px;box-shadow:0 10px 18px rgba(31,151,80,.25);animation:floatGem 3s ease-in-out infinite`;\n    const plumbobBottomStyle = `position:absolute;left:50%;top:38px;transform:translateX(-50%);width:52px;height:52px;background:linear-gradient(135deg,${gold},#c9800a);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:0;box-shadow:0 8px 14px rgba(200,130,10,.25)`;\n\n    const totalSteps = this.steps.length;\n    const step = this.steps[s.step];\n    const isBuilder = s.screen === 'builder';\n    const gemTrack = this.steps.map((st, i) => {\n      const done = i < s.step, current = i === s.step;\n      const bg = done ? `linear-gradient(135deg,${gold},#c9800a)` : current ? `linear-gradient(135deg,${accent},${accentDark})` : 'linear-gradient(135deg,#e7dfcb,#d8cfb8)';\n      return {\n        label: st.label,\n        labelColor: current ? accentDark : done ? '#a8730a' : '#a49b89',\n        diamondStyle: `width:26px;height:26px;background:${bg};clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);${current?'animation:pulseGem 1.4s ease-in-out infinite':''}`\n      };\n    });\n    const progressFillStyle = `height:100%;width:${((s.step+1)/totalSteps)*100}%;border-radius:10px;background:linear-gradient(90deg,${accent},#9be39d);transition:width .4s`;\n\n    const bubbleStyle = 'position:relative;background:#fff;border:2px solid #f0e9d8;border-radius:20px;padding:16px 20px;margin:0 0 30px;color:#7c7362;font-size:15px;line-height:1.5;display:inline-block;max-width:520px';\n    const bubbleTailStyle = 'position:absolute;left:50%;top:-9px;transform:translateX(-50%) rotate(45deg);width:16px;height:16px;background:#fff;border-left:2px solid #f0e9d8;border-top:2px solid #f0e9d8';\n\n    const choiceGridStyle = `--cols:${step && step.options[0].length>2 ? 3 : 4};display:grid;gap:12px;max-width:820px;margin:0 auto`;\n\n    const stepOptions = step ? step.options.map((o, i) => {\n      const selected = sel[step.key] === o[1];\n      return {\n        icon:o[0], name:o[1], hasDesc: !!o[2], desc:o[2]||'',\n        selected,\n        cardStyle: `min-height:112px;border:2px solid ${selected?gold:'transparent'};background:${selected?'#fff9ec':'#fff'};border-radius:20px;padding:16px;text-align:left;cursor:pointer;box-shadow:${selected?'0 10px 24px rgba(245,166,35,.2)':'0 5px 16px rgba(40,30,10,.06)'};display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;transition:.15s;font-family:'DM Sans',sans-serif`,\n        iconBadgeStyle:'display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#f7f3e6;font-size:19px',\n        checkGemStyle: this.gemStyle(16, gold, '#c9800a', 'position:absolute;top:12px;right:12px'),\n        onClick: () => this.selectOption(i)\n      };\n    }) : [];\n\n    const nextDisabled = step ? !sel[step.key] : true;\n    const nextBtnStyle = nextDisabled\n      ? `border:0;background:#eee6d2;color:#a49b89;font-family:Fredoka,sans-serif;font-weight:600;font-size:16px;padding:15px 22px;border-radius:16px;cursor:not-allowed;box-shadow:0 5px 0 #d8cfb8`\n      : primaryBtnStyle;\n\n    const cv = s.screen==='result' ? this.buildCVData(sel) : { name:'', title:'', summary:'', sections:[], vocabItems:[] };\n\n    const diamondBulletStyle = this.gemStyle(10, gold, '#c9800a', 'display:inline-block');\n    const smallDiamondStyle = this.gemStyle(7, accent, accentDark, 'display:inline-block');\n    const speechCardStyle = 'position:relative;background:#fff9ec;border:2px solid #f3e6c4;border-radius:16px;padding:14px 16px;font-size:14px;color:#6a6046;line-height:1.5;max-width:520px';\n    const dreamCardStyle = `position:relative;background:linear-gradient(135deg,#fff6e2,#fffaf0);border:2px solid ${gold};border-radius:16px;padding:14px 16px;font-size:14px;color:#6a5a2f;line-height:1.5;max-width:520px`;\n    const ribbonStyle = `position:relative;display:inline-block;background:linear-gradient(90deg,${gold},#ffce6b);color:#5c3d05;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;padding:10px 18px;border-radius:14px;margin-bottom:20px`;\n    const vocabCardStyle = 'margin:14px auto 0;max-width:700px;background:#fff9ec;border:2px solid #f3e6c4;border-radius:16px;padding:14px 16px';\n\n    const shareBtnStyle = `border:0;color:#0f3d20;background:#dff7e4;padding:11px 15px;border-radius:14px;font-family:Fredoka,sans-serif;font-weight:600;font-size:14px;cursor:pointer`;\n\n    const compareOptions = this.compareMeta.map(co => {\n      const active = s.compareType === co.key;\n      return { ...co, tileStyle:`background:${active?'#fff9ec':'#f9f6ec'};border:2px solid ${active?gold:'#efe6d3'};border-radius:18px;padding:16px;text-align:left;cursor:pointer;transition:.15s;font-family:'DM Sans',sans-serif`, onClick: () => this.pickCompareType(co.key) };\n    });\n    const activeCompare = this.compareMeta.find(c => c.key === s.compareType);\n    const compareDetailStyle = 'margin-top:16px;background:#fff9ec;border:2px solid #f3e6c4;border-radius:14px;padding:13px 16px;font-size:14px;color:#6a6046;line-height:1.4';\n    const confirmBtnStyle = `width:100%;margin-top:16px;border:0;background:${s.compareType?gold:'#eee6d2'};color:${s.compareType?'#5c3d05':'#a49b89'};font-family:Fredoka,sans-serif;font-weight:600;font-size:15px;padding:14px;border-radius:16px;cursor:${s.compareType?'pointer':'not-allowed'};box-shadow:${s.compareType?'0 6px 0 #c9800a':'none'}`;\n\n    return {\n      isWelcome: s.screen==='welcome', isBuilder, isResult: s.screen==='result',\n      accent, brandGemStyle, plumbobTopStyle, plumbobBottomStyle, teaserBars,\n      primaryBtnStyle, primaryBtnHover, primaryBtnActive, ghostBtnStyle, backBtnStyle,\n      onStart: () => this.onStart(), onRestartClick: e => this.onRestartClick(e), surprise: () => this.surprise(),\n      gemTrack, progressFillStyle, stepTitle: step?step.title:'', stepHint: step?step.hint:'',\n      bubbleStyle, bubbleTailStyle, choiceGridStyle, stepOptions,\n      onBack: () => this.onBack(), onNext: () => this.onNext(),\n      nextDisabled, nextBtnStyle, nextLabel: s.step===3 ? 'Create my dream CV' : 'Continue', nextArrow: s.step===3 ? '✦' : '→',\n      backBtnVisible: !!s.step,\n      showRibbon: this.props.showRibbon ?? true, ribbonStyle, dreamAchievement: this.achievements[sel.project]||'',\n      cvName: cv.name, cvTitle: cv.title, cvType: sel.type||'', cvSummary: cv.summary, cvSections: cv.sections,\n      diamondBulletStyle, smallDiamondStyle, speechCardStyle, dreamCardStyle, vocabCardStyle, vocabItems: cv.vocabItems,\n      openCompare: () => this.openCompare(), closeCompare: () => this.closeCompare(), closeCompareBackdrop: () => this.closeCompare(), stopClick: e => e.stopPropagation(),\n      compareOpen: s.compareOpen, compareOptions,\n      compareDetailStyle, compareDetailText: activeCompare ? activeCompare.detail : 'Select a track above to see what gets the most attention.',\n      compareConfirmDisabled: !s.compareType, confirmCompare: () => this.confirmCompare(), confirmBtnStyle,\n      onShare: () => this.onShare(), shareBusy: s.shareBusy, shareLabel: s.shareBusy ? 'Creating image…' : '📸 Share image', shareBtnStyle,\n      shareOpen: s.shareOpen, hasShareUrl: !!s.shareUrl, shareImgRef: el => { if(el && s.shareUrl) el.src = s.shareUrl; }, closeShare: () => this.closeShare(), doShare: () => this.doShare(),\n      toastShow: s.toastShow, toastMsg: s.toastMsg\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
